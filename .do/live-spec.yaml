features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: dharma-space
    match:
      authority:
        exact: ""
      path:
        prefix: /api
  - component:
      name: dharma-space-web
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: hammerhead-app
region: sgp
services:
- build_command: npm install && npm run build:backend
  environment_slug: node-js
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${dharma-db.DATABASE_URL}
  github:
    branch: main
    deploy_on_push: true
    repo: lnesto74/Dharma-Space
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: dharma-space
  run_command: npm start
  source_dir: /
static_sites:
- build_command: npm install && npm run build -w frontend
  catchall_document: index.html
  environment_slug: node-js
  envs:
  - key: VITE_API_URL
    scope: RUN_AND_BUILD_TIME
    value: ""
  github:
    branch: main
    deploy_on_push: true
    repo: lnesto74/Dharma-Space
  name: dharma-space-web
  output_dir: frontend/dist
  source_dir: /
